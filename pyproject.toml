[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-ds41f"
version = "0.1.0"
description = "Cluster orchestration, image build, doctor, benchmark and lab tooling for DeepSeek-V4.1-Flash on DGX Spark"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spark = "spark_ds41f.cli:main"
spark-lab = "spark_ds41f.lab:main"

[tool.setuptools.packages.find]
include = ["spark_ds41f*"]
