# Managed by spark3-vllm-ds41f scripts/host-recovery.
# dgxstation-grub's menu.cfg adds "quiet splash". Plymouth then leaves the
# active console in graphics mode after it quits, so an attached display shows
# no text console. Keep "quiet" and drop "splash". This file sorts after
# every other grub.d drop-in, so it sees the final default command line.
GRUB_CMDLINE_LINUX_DEFAULT="$(printf "%s" "$GRUB_CMDLINE_LINUX_DEFAULT" | sed "s/ splash//")"
