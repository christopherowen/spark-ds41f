[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spark-ds41"
version = "0.1.0"
description = "DGX Spark GB10 TileLang backend, direct-IO loader, Engram disk reader, GLP steering, and sampling kernels for DeepSeek-V4.1 on vLLM"
requires-python = ">=3.12"

[project.entry-points."vllm.general_plugins"]
spark_ds41 = "spark_ds41.plugin:register"

[tool.setuptools.packages.find]
include = ["spark_ds41*"]

[tool.setuptools.package-data]
spark_ds41 = ["**/*.c", "**/*.h"]
